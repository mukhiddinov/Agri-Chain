services:
  # Redpanda (Kafka-compatible)
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: agrichain-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - agrichain-network

  # PostgreSQL for Order and Inventory services
  postgres:
    build: ./postgres-custom
    container_name: agrichain-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: orders,inventory
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrichain-network

  # MongoDB for Catalog service
  mongodb:
    image: mongo:7
    container_name: agrichain-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: catalog
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrichain-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: agrichain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrichain-network

  # Elasticsearch (optional - commented out for minimal setup)
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
  #   container_name: agrichain-elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #   ports:
  #     - "9200:9200"
  #   volumes:
  #     - elasticsearch-data:/usr/share/elasticsearch/data
  #   networks:
  #     - agrichain-network

  # Keycloak for authentication (commented out for initial setup)
  # keycloak:
  #   image: quay.io/keycloak/keycloak:23.0
  #   container_name: agrichain-keycloak
  #   environment:
  #     KEYCLOAK_ADMIN: admin
  #     KEYCLOAK_ADMIN_PASSWORD: admin
  #   command:
  #     - start-dev
  #   ports:
  #     - "8180:8080"
  #   networks:
  #     - agrichain-network

  api-gateway:
    build: ./api-gateway
    container_name: agrichain-api-gateway
    ports:
      - "8080:8080"
    networks:
      - agrichain-network
    depends_on:
      - redpanda
      - postgres
      - mongodb
      - redis
      - order-service
      - catalog-service
      - payment-service
    environment:
      # Inject RPC_URL and PRIVATE_KEY for payment service to use with blockchain
      SEPOLIA_RPC_URL: "https://eth-sepolia.g.alchemy.com/v2/bZrI3-ZI968DG0WToud2d"
      PRIVATE_KEY: "b147256c48ad5b4180dd81a480e926c9c1e37c0add7b3803c0f07d3e919ef667"
      # Service URLs for WebClientConfig
      gateway.services.order: http://order-service:8081
      gateway.services.catalog: http://catalog-service:8085
      gateway.services.payment: http://payment-service:8083

  order-service:
    build: ./order-service
    container_name: agrichain-order-service
    ports:
      - "8081:8081"
    networks:
      - agrichain-network
    depends_on:
      - redpanda
      - postgres
      - inventory-service # Depends on inventory for stock checks
    environment:
      # Database connection for Order Service
      SPRING_DATASOURCE_URL: jdbc:postgresql://agrichain-postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Redpanda/Kafka configuration
      SPRING_KAFKA_BOOTSTRAP_SERVERS: agrichain-redpanda:9092
      # gRPC client for Inventory Service
      grpc.client.inventory-service.address: static://agrichain-inventory-service:9090
      grpc.client.inventory-service.negotiation-type: plaintext

  inventory-service:
    build: ./inventory-service
    container_name: agrichain-inventory-service
    ports:
      - "8082:8082" # HTTP port (if any)
      - "9090:9090" # gRPC port
    networks:
      - agrichain-network
    depends_on:
      - redpanda
      - postgres
    environment:
      # Database connection for Inventory Service
      SPRING_DATASOURCE_URL: jdbc:postgresql://agrichain-postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Redpanda/Kafka configuration
      SPRING_KAFKA_BOOTSTRAP_SERVERS: agrichain-redpanda:9092

  payment-service:
    build: ./payment-service
    container_name: agrichain-payment-service
    ports:
      - "8083:8083"
    networks:
      - agrichain-network
    depends_on:
      - redpanda
    environment:
      # Redpanda/Kafka configuration
      SPRING_KAFKA_BOOTSTRAP_SERVERS: agrichain-redpanda:9092
      # Blockchain configuration (assuming these are picked up by the service)
      SEPOLIA_RPC_URL: "https://eth-sepolia.g.alchemy.com/v2/bZrI3-ZI968DG0WToud2d"
      PRIVATE_KEY: "b147256c48ad5b4180dd81a480e926c9c1e37c0add7b3803c0f07d3e919ef667"


  catalog-service:
    build: ./catalog-service
    container_name: agrichain-catalog-service
    ports:
      - "8085:8085"
    networks:
      - agrichain-network
    depends_on:
      - mongodb
    environment:
      # MongoDB connection for Catalog Service
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin@mongodb:27017/catalog?authSource=admin

  orchestrator-service:
    build: ./orchestrator-service
    container_name: agrichain-orchestrator-service
    ports:
      - "8084:8084" # HTTP port if any
    networks:
      - agrichain-network
    depends_on:
      - redpanda
      - order-service
      - inventory-service
      - payment-service
    environment:
      # Redpanda/Kafka configuration
      SPRING_KAFKA_BOOTSTRAP_SERVERS: agrichain-redpanda:9092

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  # elasticsearch-data:

networks:
  agrichain-network:
    driver: bridge
